spring:
    application:
        name: spring-chat-socket
        title: 'Aplicación de chat realtime'
        version: '1.0.0'
        front:
            url: ${FRONTEND_URL:http://localhost:4200}
    datasource:
        url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chat}
        username: ${DATABASE_USERNAME:chat}
        password: ${DATABASE_PASSWORD:chat}
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    flyway:
        enabled: true
    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
                        scope:
                            - openid
                            - profile
                            - email
server:
    port: ${SERVER_PORT:3000}