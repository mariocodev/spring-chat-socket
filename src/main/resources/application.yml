spring:
    application:
        name: '@project.name@'
        title: '@project.description@'
        version: '@project.version@'
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:local}
logging:
    file:
        name: logs/mi-app-example.log
    pattern:
        console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:-
            }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan}
            %clr(:){faint} %m%n%clr(%throwable){red}'
        file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] %-40.40logger{39}
            : %m%n%throwable'